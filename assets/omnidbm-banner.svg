<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="omnidbm — universal database-to-database transfer engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#141b3d"/>
      <stop offset="100%" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      @keyframes floatUp {
        0%   { transform: translateY(0); opacity: 0; }
        12%  { opacity: 0.7; }
        85%  { opacity: 0.25; }
        100% { transform: translateY(-46px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.15; }
      }
      @keyframes sweep {
        0%   { transform: translateX(-140px); }
        100% { transform: translateX(880px); }
      }
      @keyframes scanX {
        0%   { transform: translateX(0); }
        100% { transform: translateX(1200px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.55; }
        50%      { opacity: 1; }
      }
      .p1 { animation: floatUp 6s ease-in infinite; }
      .p2 { animation: floatUp 7.5s ease-in 1.2s infinite; }
      .p3 { animation: floatUp 5.5s ease-in 2.4s infinite; }
      .p4 { animation: floatUp 8s ease-in 0.6s infinite; }
      .p5 { animation: floatUp 6.5s ease-in 3s infinite; }
      .p6 { animation: floatUp 7s ease-in 1.8s infinite; }
      .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
      .packet-a { animation: blink 1s ease-in-out infinite; }
      .packet-b { animation: blink 1s ease-in-out 0.5s infinite; }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      .scanline { animation: scanX 9s linear infinite; }
      .title-shine { animation: glowPulse 4s ease-in-out infinite; }
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="180" cy="80" r="180" fill="url(#glowA)"/>
  <circle cx="1080" cy="240" r="220" fill="url(#glowB)"/>
  <circle cx="640" cy="300" r="260" fill="url(#glowA)"/>

  <g opacity="0.5">
    <circle cx="120" cy="60" r="2.2" fill="#22d3ee" class="p1"/>
    <circle cx="230" cy="40" r="1.8" fill="#c084fc" class="p2"/>
    <circle cx="330" cy="70" r="2" fill="#818cf8" class="p3"/>
    <circle cx="520" cy="34" r="2.2" fill="#22d3ee" class="p4"/>
    <circle cx="700" cy="56" r="1.8" fill="#c084fc" class="p5"/>
    <circle cx="880" cy="38" r="2" fill="#818cf8" class="p6"/>
    <circle cx="1060" cy="64" r="2.2" fill="#22d3ee" class="p1"/>
    <circle cx="1000" cy="180" r="1.8" fill="#c084fc" class="p3"/>
    <circle cx="1100" cy="120" r="2" fill="#818cf8" class="p5"/>
    <circle cx="60" cy="200" r="1.8" fill="#22d3ee" class="p2"/>
    <circle cx="180" cy="250" r="2" fill="#c084fc" class="p4"/>
    <circle cx="500" cy="250" r="1.8" fill="#22d3ee" class="p6"/>
  </g>

  <g id="transfer">
    <path id="route" d="M 178 168 C 216 204, 272 204, 310 168" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle r="4.5" fill="#22d3ee">
      <animateMotion dur="2.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="4.5" fill="#a78bfa">
      <animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="2.5" fill="#ffffff" class="packet-a">
      <animateMotion dur="2.2s" repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>
    <circle r="2.5" fill="#ffffff" class="packet-b">
      <animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite">
        <mpath href="#route"/>
      </animateMotion>
    </circle>

    <g id="src">
      <ellipse cx="140" cy="118" rx="44" ry="11" fill="#1e293b" stroke="#64748b" stroke-opacity="0.5"/>
      <path d="M96 118 v58 a44 11 0 0 0 88 0 v-58 a44 11 0 0 0 -88 0" fill="#0f1a2e" stroke="#64748b" stroke-opacity="0.5"/>
      <ellipse cx="140" cy="118" rx="44" ry="11" fill="#0e7490" fill-opacity="0.85">
        <animate attributeName="fill-opacity" values="0.85;0.45;0.85" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <text x="140" y="112" text-anchor="middle" font-size="10" letter-spacing="2.5" fill="#94a3b8">SOURCE</text>
    </g>

    <g id="dst">
      <ellipse cx="318" cy="118" rx="44" ry="11" fill="#1e293b" stroke="#64748b" stroke-opacity="0.5"/>
      <path d="M274 118 v58 a44 11 0 0 0 88 0 v-58 a44 11 0 0 0 -88 0" fill="#0f1a2e" stroke="#64748b" stroke-opacity="0.5"/>
      <ellipse cx="318" cy="118" rx="44" ry="11" fill="#7c3aed" fill-opacity="0.85">
        <animate attributeName="fill-opacity" values="0.85;0.45;0.85" dur="4s" begin="2s" repeatCount="indefinite"/>
      </ellipse>
      <text x="318" y="112" text-anchor="middle" font-size="10" letter-spacing="2.5" fill="#94a3b8">DESTINATION</text>
    </g>
  </g>

  <g id="wordmark">
    <text x="396" y="132" font-size="58" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">omnidbm</text>
    <g class="sweep" opacity="0.9">
      <rect x="396" y="86" width="110" height="46" fill="url(#scan)"/>
    </g>
    <text x="399" y="168" font-size="17" fill="#94a3b8" letter-spacing="0.5">Universal database-to-database transfer engine</text>
  </g>

  <g id="badges" font-size="12.5" font-weight="600">
    <g>
      <rect x="398" y="206" width="96" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="446" y="224" text-anchor="middle" fill="#38bdf8">v0.1.4</text>
    </g>
    <g>
      <rect x="506" y="206" width="130" height="28" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-opacity="0.55"/>
      <text x="571" y="224" text-anchor="middle" fill="#fbbf24">Python 3.10+</text>
    </g>
    <g>
      <rect x="648" y="206" width="132" height="28" rx="14" fill="#1e293b" stroke="#22d3ee" stroke-opacity="0.55"/>
      <text x="714" y="224" text-anchor="middle" fill="#22d3ee">7 connectors</text>
    </g>
    <g>
      <rect x="792" y="206" width="110" height="28" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="847" y="224" text-anchor="middle" fill="#a78bfa">MIT license</text>
    </g>
    <g>
      <rect x="914" y="206" width="166" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-opacity="0.6"/>
      <circle cx="930" cy="220" r="4.5" fill="#34d399" class="pulse-dot"/>
      <text x="1000" y="224" text-anchor="middle" fill="#34d399">50 tests passing</text>
    </g>
  </g>
</svg>