[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnidbm"
version = "0.1.0"
description = "Universal database-to-database transfer engine with an interactive CLI (MongoDB, PostgreSQL, MySQL, SQLite, Redis, CSV, JSONL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aritra" }]
keywords = ["database", "migration", "transfer", "mongodb", "postgresql", "mysql", "sqlite", "redis", "csv", "jsonl", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pymongo>=4.6",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
redis = ["redis>=5.0"]
all = ["PyMySQL>=1.1", "redis>=5.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "PyMySQL>=1.1",
    "redis>=5.0",
]

[project.scripts]
omnidbm = "omnidbm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["omnidbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["mongotransfer.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "FURB", "DTZ", "PYI"]
ignore = ["PYI034", "B027", "S608"]

[tool.ruff.lint.per-file-ignores]
"omnidbm/cli.py" = ["B008"]
"tests/*" = ["S101"]